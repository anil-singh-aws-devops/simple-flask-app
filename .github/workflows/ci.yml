name: Flask CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # -------------------------
  # BUILD
  # -------------------------
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python code
        run: |
          python -m compileall .

      - name: Create application package
        run: |
          mkdir -p build
          zip -r build/flask-app.zip app.py requirements.txt test_app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-app-build
          path: build/flask-app.zip


  # -------------------------
  # TEST
  # -------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest -v

      - name: Run flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics


  # -------------------------
  # PUBLISH
  # -------------------------
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test

    # Publish only after changes reach main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: flask-app-build
          path: build

      - name: Publish CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-app-release
          path: build/flask-app.zip

name: Flask CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: simple-flask-app

jobs:

  # ==========================================
  # BUILD + TEST
  # ==========================================
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Compile Python code
        run: |
          python -m compileall app.py test_app.py

      - name: Run lint
        run: |
          flake8 app.py test_app.py

      - name: Run tests
        run: |
          pytest -v


  # ==========================================
  # DOCKER BUILD + PUSH
  # ==========================================
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-test

    # Push image only when code is pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-flask-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-flask-app:${{ github.sha }}
